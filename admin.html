<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>옥새를 찾아라 · 관리자</title><style>body{margin:0;background:#120f0c;color:#f6efe1;font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR",sans-serif}.wrap{width:min(1200px,calc(100% - 28px));margin:30px auto}.card{background:#211912;border:1px solid rgba(216,181,110,.25);border-radius:22px;padding:24px;margin-bottom:18px}h1,h2{font-family:serif;color:#f0d79b}.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}input,button{padding:12px 14px;border-radius:12px;border:1px solid rgba(216,181,110,.35);background:#17120e;color:#f6efe1;font-size:15px}button{cursor:pointer;background:#d8b56e;color:#1b140e;font-weight:800}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-top:18px}.stat{background:#17120e;border-radius:14px;padding:16px}.stat b{display:block;color:#f0d79b;font-size:25px}.tablewrap{overflow:auto}table{width:100%;border-collapse:collapse;min-width:1000px}th,td{padding:11px 9px;border-bottom:1px solid rgba(216,181,110,.16);text-align:left;font-size:14px}th{color:#d8b56e;position:sticky;top:0;background:#211912}.one{color:#f0d79b;font-weight:900}.match{color:#8fbe9d}.no{color:#d97970}.muted{color:#b9ad9b}@media(max-width:800px){.stats{grid-template-columns:repeat(2,1fr)}}</style><script src="config.js"></script></head><body><main class="wrap"><section class="card"><h1>옥새를 찾아라 · 관리자 대시보드</h1><div class="row"><input id="pin" type="password" placeholder="관리자 PIN"><button onclick="loadResults()">결과 불러오기</button><button onclick="loadResults()">새로고침</button></div><div class="stats"><div class="stat"><span class="muted">완료자</span><b id="count">-</b></div><div class="stat"><span class="muted">현재 1위</span><b id="winner">-</b></div><div class="stat"><span class="muted">평균 정답</span><b id="avg">-</b></div><div class="stat"><span class="muted">평균 시간</span><b id="time">-</b></div></div></section><section class="card"><h2>실시간 순위</h2><p class="muted">순위는 완료자가 늘어날 때마다 바뀔 수 있습니다. 시상 직전에 새로고침해 최종 확정하세요.</p><div class="tablewrap"><table><thead><tr><th>순위</th><th>이름</th><th>총점</th><th>정확도</th><th>속도</th><th>자기매칭</th><th>소요시간</th><th>대표 카드</th><th>본인 선택</th><th>1~6단계 시도수</th></tr></thead><tbody id="rows"></tbody></table></div></section></main><script>
let cbSeq=0;function fmt(ms){const s=Math.round(ms/1000);return `${Math.floor(s/60)}분 ${s%60}초`}function loadResults(){const api=window.OKSAI_API_URL||'';const p=pin.value.trim();if(!api){alert('백엔드 주소가 아직 설정되지 않았습니다.');return}if(!p){alert('관리자 PIN을 입력해 주세요.');return}const cb='oksaiCb'+(++cbSeq);window[cb]=d=>{delete window[cb];render(d)};const s=document.createElement('script');s.src=`${api}?action=results&pin=${encodeURIComponent(p)}&callback=${cb}&t=${Date.now()}`;s.onerror=()=>alert('결과를 불러오지 못했습니다.');document.body.appendChild(s)}
function render(d){if(!d||d.ok===false){alert(d&&d.error?d.error:'권한 또는 연결을 확인해 주세요.');return}const a=d.results||[];const n=a.length;if(!n){rows.innerHTML='<tr><td colspan="10">아직 완료자가 없습니다.</td></tr>';count.textContent='0';return}a.sort((x,y)=>x.duration_ms-y.duration_ms);a.forEach((r,i)=>r.speed_score=n===1?25:Math.round(25*(n-1-i)/(n-1)*10)/10);a.forEach(r=>{r.accuracy_score=(+r.first_correct||0)*10;r.match_score=r.self_match?15:0;r.total_score=r.accuracy_score+r.speed_score+r.match_score});a.sort((x,y)=>y.total_score-x.total_score||y.accuracy_score-x.accuracy_score||x.duration_ms-y.duration_ms);count.textContent=n;winner.textContent=a[0].name;avg.textContent=(a.reduce((s,r)=>s+(+r.first_correct||0),0)/n).toFixed(1)+'/6';time.textContent=fmt(a.reduce((s,r)=>s+(+r.duration_ms||0),0)/n);rows.innerHTML=a.map((r,i)=>`<tr><td class="${i===0?'one':''}">${i+1}</td><td>${esc(r.name)}</td><td><b>${r.total_score.toFixed(1)}</b></td><td>${r.accuracy_score}</td><td>${r.speed_score.toFixed(1)}</td><td class="${r.self_match?'match':'no'}">${r.self_match?'성공 +15':'불일치'}</td><td>${fmt(+r.duration_ms||0)}</td><td>${esc(r.predicted_card)}</td><td>${esc(r.self_card)}</td><td>${(r.attempts||[]).join(' · ')}</td></tr>`).join('')}
function esc(x){return String(x??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
</script></body></html>
